<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>iPhone Tilt → Mac Keyboard</title>
<style>
  body {
    font-size: 32px;
    text-align: center;
    margin-top: 50px;
    font-family: sans-serif;
  }
  button {
    font-size: 28px;
    padding: 20px 40px;
  }
</style>
</head>
<body>
<h1>iPhone Tilt → Mac</h1>
<p id="status">Tap below to start streaming</p>
<button id="startBtn">Start Streaming</button>

<script>
const MAC_IP = "192.168.0.24"; // Replace with your Mac's IP
const WS_PORT = 8765;
const DEADZONE = 8;      // Tilt degrees ignored around center
const SCALE = 1;         // Optional multiplier for tilt sensitivity

let ws = null;

document.getElementById("startBtn").onclick = async () => {
    // Request motion permission on iOS 13+
    if (typeof DeviceMotionEvent !== 'undefined' &&
        typeof DeviceMotionEvent.requestPermission === 'function') {
        const response = await DeviceMotionEvent.requestPermission();
        if (response !== 'granted') {
            alert("Motion permission denied! Cannot stream tilt.");
            return;
        }
    }

    // Open WebSocket
    ws = new WebSocket(`ws://${MAC_IP}:${WS_PORT}`);
    ws.onopen = () => {
        document.getElementById("status").innerText = "Streaming motion…";
        console.log("WebSocket connected");
    };
    ws.onerror = (err) => console.error("WebSocket error", err);
    ws.onclose = () => console.log("WebSocket closed");

    // Send tilt data continuously
    window.addEventListener("deviceorientation", (event) => {
        if (ws && ws.readyState === 1) {
            let tilt = event.gamma * SCALE; // gamma = left/right tilt in degrees

            // Apply deadzone
            if (tilt > -DEADZONE && tilt < DEADZONE) tilt = 0;

            ws.send(JSON.stringify({ tilt: tilt }));
        }
    });

    // Disable button after starting
    document.getElementById("startBtn").disabled = true;
};
</script>
</body>
</html>
